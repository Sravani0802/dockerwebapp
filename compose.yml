services:
  application:
    image: sravani248/my-dockerhub-repo:image-app
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb

  devopsdb:
    image: sravani248/my-dockerhub-repo:image-db
    ports:
      - "1112:3306"
    volumes:
      - userdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSOWRD: "devopspassword"
    deploy:
      resources:
        reservations:
          cpus: "1.0"
          memory: 1000M
        limits:
          cpus: "2.0"
          memory: 2000M

volumes:
  userdata:


